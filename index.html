<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keep track</title>
<style>
:root{
  --bg:#fbfaf7; --fg:#22241f; --muted:#6d7166; --card:#f1efe9; --border:#dcd9cf;
  --empty:#e7e4da; --accent:#2f8f5b; --cell:14px; --gap:3px;
  font-family: ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
:root[data-theme=dark]{
  --bg:#14161a; --fg:#e8e6df; --muted:#9a9c94; --card:#1c1f24; --border:#2d3139; --empty:#262a31;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);line-height:1.4}
main{max-width:960px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:1.3rem;margin:0;font-weight:700;letter-spacing:-.01em}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input[type=color]{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer}
input[type=color]{padding:2px;width:34px;height:32px}
button:hover,select:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.nav{display:flex;gap:6px;align-items:center}
.nav b{min-width:130px;text-align:center;font-size:1.05rem}
.seg{display:flex;gap:0}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.scroll{overflow-x:auto;padding-bottom:6px}
.heat{display:flex;gap:8px}
.wd{display:grid;grid-template-rows:repeat(7,var(--cell));gap:var(--gap);font-size:10px;color:var(--muted);margin-top:calc(16px + var(--gap))}
.wd span{line-height:var(--cell)}
.months{display:grid;grid-auto-columns:var(--cell);gap:var(--gap);height:16px;font-size:11px;color:var(--muted);margin-bottom:var(--gap)}
.months span{white-space:nowrap;cursor:pointer}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--cell));grid-auto-columns:var(--cell);gap:var(--gap)}
.cell{border-radius:3px;background:var(--empty);cursor:pointer}
.cell.blank{visibility:hidden;cursor:default}
.l1{background:color-mix(in srgb,var(--accent) 30%,var(--empty))}
.l2{background:color-mix(in srgb,var(--accent) 55%,var(--empty))}
.l3{background:color-mix(in srgb,var(--accent) 78%,var(--empty))}
.l4{background:var(--accent)}
.today{box-shadow:0 0 0 2px var(--fg)}
.sel{outline:2px solid var(--fg);outline-offset:1px}
.legend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);justify-content:flex-end;margin-top:10px}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{padding:2px 0}
.stat b{display:block;font-size:1.5rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:90px}
.mb{display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:stretch;cursor:pointer;gap:4px}
.mb div{background:var(--accent);border-radius:4px 4px 2px 2px;min-height:3px;opacity:.9}
.mb div.z{background:var(--empty)}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{font-size:11px;color:var(--muted);text-align:center}
.day{min-height:78px;border-radius:8px;padding:6px;background:var(--empty);cursor:pointer;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.day.out{visibility:hidden;cursor:default}
.day small{font-size:11px;font-weight:600;opacity:.85}
.day.l4 small,.day.l3 small{color:#fff}
.pips{display:flex;flex-wrap:wrap;gap:3px}
.pip{width:8px;height:8px;border-radius:50%;background:var(--accent);display:block}
.day.l3 .pip,.day.l4 .pip{background:#fff}
.pips em{font-size:10px;font-style:normal}
.detail{display:flex;gap:14px;align-items:center;flex-wrap:wrap;min-height:34px}
.detail .pips{max-width:100%}
.detail .pip{width:12px;height:12px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:26px 10px}
.empty p{max-width:520px;margin:6px auto;color:var(--muted)}
code{background:var(--empty);padding:1px 5px;border-radius:4px;font-size:.9em}
.drop{outline:2px dashed var(--accent);outline-offset:-8px}
button:disabled{opacity:.4;cursor:default}
.status{font-size:.8rem;color:var(--muted)}
.status.err{color:#d1453b;cursor:pointer;text-decoration:underline}
.ctl{margin-left:auto;display:flex;gap:6px;align-items:center}
.ctl button{min-width:44px;font-weight:700}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:12px;max-width:420px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 4px;font-size:1.1rem}
dialog label{display:block;margin-top:10px;font-size:.85rem;color:var(--muted)}
dialog input{display:block;width:100%;margin-top:4px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
dialog .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
dialog .small{font-size:.8rem;margin:10px 0 0}
@media(max-width:560px){.day{min-height:56px;padding:4px}.pip{width:6px;height:6px}}
</style>
</head>
<body>
<main id="app">
  <header>
    <h1 id="title">Keep track</h1>
    <div class="tools">
      <select id="tracker" aria-label="Tracker" hidden></select>
      <input type="color" id="accent" title="Accent colour" aria-label="Accent colour">
      <span id="status" class="status" role="status"></span>
      <button id="settings" title="Save changes to GitHub">GitHub</button>
      <button id="reload" title="Reload data file">Reload</button>
      <button id="open" title="Open a data file">Open file</button>
      <button id="theme" aria-label="Toggle dark mode">Dark</button>
      <input type="file" id="file" accept=".json,.txt,text/plain,application/json" hidden>
    </div>
  </header>
  <div id="content"></div>
</main>

<dialog id="dlg">
  <form id="cfg">
    <h2>Save to GitHub</h2>
    <p class="muted small">Changes are committed straight to the data file in your repo.</p>
    <label>Repository <input id="c-repo" placeholder="you/your-repo" autocomplete="off" required></label>
    <label>Branch <input id="c-branch" placeholder="main" autocomplete="off"></label>
    <label>Data file <input id="c-path" placeholder="data.txt" autocomplete="off" required></label>
    <label>Access token <input id="c-token" type="password" autocomplete="off" required></label>
    <p class="muted small">Use a fine-grained token limited to this one repo with “Contents: read and write”. It is stored in this browser only.</p>
    <div class="row">
      <button type="button" id="c-forget">Forget token</button>
      <button type="button" id="c-cancel">Cancel</button>
      <button class="on">Save</button>
    </div>
  </form>
</dialog>

<script>
/* ---- Config ---- */
const FILES = ['data.json', 'data.txt'];   // looked up next to this page, in this order
const WEEK_START = 1;                      // 1 = Monday, 0 = Sunday
const DEFAULT_ACCENT = '#2f8f5b';

/* ---- Helpers ---- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const key = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const dayIdx = k => { const [y, m, d] = k.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mName = (m, long) => new Date(2000, m, 1).toLocaleString(undefined, {month: long ? 'long' : 'short'});
const fmtDate = k => { const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'}); };
const now = new Date();
const TODAY = key(now.getFullYear(), now.getMonth(), now.getDate());
const ALL = '__all__';

const S = { data: {}, tracker: ALL, view: 'year', year: now.getFullYear(), month: now.getMonth(), sel: TODAY, loaded: false, title: 'Keep track', pending: [], saving: false, source: null };

/* ---- Parsing ---- */
function normDate(s) {
  const m = String(s).match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  return m ? key(+m[1], +m[2] - 1, +m[3]) : null;
}
function add(data, tracker, date, n) {
  const d = normDate(date); if (!d || !(n > 0)) return;
  ((data[tracker] ||= {})[d] = (data[tracker][d] || 0) + n);
}
function parse(text) {
  const data = {}; let title = null;
  let json; try { json = JSON.parse(text); } catch { json = undefined; }
  if (json !== undefined) {
    if (Array.isArray(json)) {
      json.forEach(e => typeof e === 'string' ? add(data, 'Tracker', e, 1)
        : add(data, e.tracker || e.name || 'Tracker', e.date, e.count ?? 1));
    } else if (json && typeof json === 'object') {
      if (typeof json.title === 'string') title = json.title;
      const src = json.trackers || json.data || json;
      for (const [k, v] of Object.entries(src)) {
        if (k === 'title') continue;
        if (typeof v === 'number') add(data, 'Tracker', k, v);                   // {"2026-01-05": 3}
        else if (Array.isArray(v)) v.forEach(e => typeof e === 'string' ? add(data, k, e, 1) : add(data, k, e.date, e.count ?? 1));
        else if (v && typeof v === 'object') for (const [d, n] of Object.entries(v)) add(data, k, d, +n);
      }
    }
  } else {
    text.split(/\r?\n/).forEach(line => {
      line = line.replace(/\s#.*$|^#.*$/, '').trim(); if (!line) return;
      const m = line.match(/^(\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2})\S*\s*(?:[x×]?\s*(\d+))?\s*(.*)$/);
      if (m) add(data, m[3].replace(/^[|,;:\-\s]+/, '').trim() || 'Tracker', m[1], m[2] ? +m[2] : 1);
    });
  }
  return { data, title };
}
function syncSelect() {
  const names = Object.keys(S.data);
  if (S.tracker !== ALL && !names.includes(S.tracker)) S.tracker = ALL;
  if (names.length === 1) S.tracker = names[0];
  const sel = $('#tracker');
  sel.hidden = names.length < 2;
  sel.innerHTML = (names.length > 1 ? `<option value="${ALL}">All</option>` : '') +
    names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  sel.value = S.tracker;
}
function applyData(data, title) {
  S.data = data; S.loaded = true;
  S.title = title || 'Keep track'; document.title = S.title; $('#title').textContent = S.title;
  render();
}
function setData(text, src) {
  if (src) S.source = src;
  const r = parse(text); applyData(r.data, r.title);
}

/* ---- Writing back (GitHub) ---- */
function leadComments(text) {
  if (/^\s*[\[{]/.test(text)) return [];
  const out = [];
  for (const l of text.split(/\r?\n/)) { if (/^\s*#/.test(l)) out.push(l); else if (l.trim() === '') continue; else break; }
  return out;
}
function serialize(data, title, header, asJson) {
  const rows = [];
  for (const [n, m] of Object.entries(data)) for (const [d, c] of Object.entries(m)) if (c > 0) rows.push([d, n, c]);
  rows.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : a[1] < b[1] ? -1 : 1);
  if (asJson) {
    const o = {}; if (title && title !== 'Keep track') o.title = title;
    const names = [...new Set(rows.map(r => r[1]))].sort();
    const mapOf = n => Object.fromEntries(rows.filter(r => r[1] === n).map(r => [r[0], r[2]]));
    if (names.length === 1 && names[0] === 'Tracker') Object.assign(o, mapOf('Tracker'));
    else names.forEach(n => o[n] = mapOf(n));
    return JSON.stringify(o, null, 2) + '\n';
  }
  return [...header, ...rows.map(([d, n, c]) => `${d} ${c}${n === 'Tracker' ? '' : ' ' + n}`)].join('\n') + '\n';
}
const GH_KEY = 'kt-gh';
function ghCfg() { try { return JSON.parse(read(GH_KEY) || 'null'); } catch { return null; } }
const ghOk = c => !!(c && c.repo && c.token && c.path);
const b64e = s => { let t = ''; new TextEncoder().encode(s).forEach(x => t += String.fromCharCode(x)); return btoa(t); };
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
async function gh(c, method, body) {
  const path = c.path.split('/').map(encodeURIComponent).join('/');
  const url = `https://api.github.com/repos/${c.repo}/contents/${path}` + (method === 'GET' ? `?ref=${encodeURIComponent(c.branch)}` : '');
  const r = await fetch(url, { method, cache: 'no-store', body: body && JSON.stringify(body),
    headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + c.token } });
  if (r.status === 404 && method === 'GET') return null;          // file doesn't exist yet
  if (!r.ok) {
    const e = new Error(r.status === 401 ? 'token rejected' : r.status === 403 ? 'token has no write access'
      : r.status === 404 ? 'repo or branch not found' : (r.status === 409 || r.status === 422) ? 'conflict' : 'GitHub error ' + r.status);
    throw e;
  }
  return r.json();
}
async function commit(batch) {
  const c = ghCfg(), asJson = /\.json$/i.test(c.path);
  for (let i = 0; i < 3; i++) {
    const f = await gh(c, 'GET');                                  // always start from the latest remote copy
    const text = f ? b64d(f.content) : '';
    const r = text.trim() ? parse(text) : { data: {}, title: null };
    for (const { t, d, n } of batch) {
      const m = (r.data[t] ||= {}); m[d] = Math.max(0, (m[d] || 0) + n); if (!m[d]) delete m[d];
    }
    const msg = batch.length === 1 ? `${batch[0].t} ${batch[0].n > 0 ? '+' : '−'}1 on ${batch[0].d}` : `Update tracker (${batch.length} changes)`;
    try {
      await gh(c, 'PUT', { message: msg, branch: c.branch, content: b64e(serialize(r.data, r.title, leadComments(text), asJson)), ...(f ? { sha: f.sha } : {}) });
      return r;
    } catch (e) { if (e.message !== 'conflict' || i === 2) throw e; }
  }
}
function setStatus(msg, err) {
  const el = $('#status'); el.textContent = msg; el.className = 'status' + (err ? ' err' : '');
  if (msg === 'Saved ✓') setTimeout(() => { if (el.textContent === 'Saved ✓') el.textContent = ''; }, 3000);
}
async function flush() {
  if (S.saving) return;
  S.saving = true; setStatus('Saving…');
  try {
    while (S.pending.length) {
      const batch = S.pending.splice(0);
      try { const r = await commit(batch); if (!S.pending.length) applyData(r.data, r.title); }
      catch (e) { S.pending.unshift(...batch); setStatus('Not saved: ' + e.message + ' (click to retry)', true); return; }
    }
    setStatus('Saved ✓');
  } finally { S.saving = false; }
}
function editTracker() {
  const names = Object.keys(S.data);
  if (S.tracker !== ALL) return S.tracker;
  return names.length < 2 ? (names[0] || 'Tracker') : null;
}
function change(n) {
  const t = editTracker(); if (!t) return;
  if (!ghOk(ghCfg())) { openSettings(); return; }
  const m = (S.data[t] ||= {}), old = m[S.sel] || 0, v = Math.max(0, old + n);
  if (v === old) return;
  v ? m[S.sel] = v : delete m[S.sel];
  S.pending.push({ t, d: S.sel, n: v - old });
  render(); flush();
}

/* ---- Data access ---- */
function getMap() {
  if (S.tracker !== ALL) return S.data[S.tracker] || {};
  const out = {};
  for (const t of Object.values(S.data)) for (const [d, n] of Object.entries(t)) out[d] = (out[d] || 0) + n;
  return out;
}
const levelOf = (c, max) => !c ? 0 : max <= 4 ? Math.min(c, 4) : Math.max(1, Math.ceil(c / max * 4));
function pips(c, limit = 40) {
  return Array.from({length: Math.min(c, limit)}, () => '<span class="pip"></span>').join('') + (c > limit ? `<em>+${c - limit}</em>` : '');
}
function streaks(map) {
  const days = Object.keys(map).filter(k => map[k] > 0).map(dayIdx).sort((a, b) => a - b);
  let best = 0, run = 0, prev = null;
  for (const d of days) { run = prev !== null && d === prev + 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  let cur = 0, i = dayIdx(TODAY); if (!map[TODAY]) i--;
  const set = new Set(days); while (set.has(i)) { cur++; i--; }
  return { best, cur };
}

/* ---- Rendering ---- */
function render() {
  syncSelect();
  const el = $('#content');
  const keepScroll = document.querySelector('.scroll')?.scrollLeft || 0;
  if (!S.loaded) { el.innerHTML = emptyState(); return; }
  const map = getMap(), y = S.year, m = S.month;
  const inPeriod = k => S.view === 'year' ? k.startsWith(y + '-') : k.startsWith(`${y}-${pad(m + 1)}-`);
  const keys = Object.keys(map).filter(k => inPeriod(k) && map[k] > 0);
  const total = keys.reduce((a, k) => a + map[k], 0);
  const best = keys.reduce((a, k) => Math.max(a, map[k]), 0);
  const st = streaks(map);

  const label = S.view === 'year' ? y : `${mName(m, true)} ${y}`;
  let html = `<div class="bar">
    <div class="nav"><button data-nav="-1" aria-label="Previous">‹</button><b>${label}</b><button data-nav="1" aria-label="Next">›</button>
    <button data-nav="today">Today</button></div>
    <div class="seg"><button data-view="year" class="${S.view === 'year' ? 'on' : ''}">Year</button>
    <button data-view="month" class="${S.view === 'month' ? 'on' : ''}">Month</button></div></div>`;

  html += `<div class="panel stats">
    <div class="stat"><b>${total}</b><span>this ${S.view}</span></div>
    <div class="stat"><b>${keys.length}</b><span>active days</span></div>
    <div class="stat"><b>${best}</b><span>best day</span></div>
    <div class="stat"><b>${st.cur}</b><span>current streak</span></div>
    <div class="stat"><b>${st.best}</b><span>longest streak</span></div></div>`;

  html += `<div class="panel">${S.view === 'year' ? yearView(map, y) : monthView(map, y, m)}</div>`;
  if (S.view === 'year') html += `<div class="panel">${monthBars(map, y)}</div>`;
  html += `<div class="panel detail" id="detail">${detail(map)}</div>`;
  el.innerHTML = html;
  const sc = document.querySelector('.scroll'); if (sc) sc.scrollLeft = keepScroll;
}

function yearView(map, y) {
  let max = 0; for (const [k, v] of Object.entries(map)) if (k.startsWith(y + '-')) max = Math.max(max, v);
  const first = new Date(y, 0, 1), off = (first.getDay() - WEEK_START + 7) % 7;
  const days = (new Date(y, 11, 31) - first) / 864e5 + 1 | 0;
  const cols = Math.ceil((off + days) / 7);
  let cells = '<div class="cell blank"></div>'.repeat(off);
  for (let m = 0; m < 12; m++) for (let d = 1; d <= dim(y, m); d++) {
    const k = key(y, m, d), c = map[k] || 0;
    cells += `<div class="cell l${levelOf(c, max)}${k === TODAY ? ' today' : ''}${k === S.sel ? ' sel' : ''}" data-d="${k}" tabindex="-1" title="${c} on ${fmtDate(k)}"></div>`;
  }
  let labs = '';
  for (let m = 0; m < 12; m++) {
    const idx = Math.round((new Date(y, m, 1) - first) / 864e5) + off;
    labs += `<span data-month="${m}" style="grid-column:${Math.floor(idx / 7) + 1}">${mName(m)}</span>`;
  }
  const wd = Array.from({length: 7}, (_, i) => (i % 2 === 1)
    ? new Date(2023, 0, 1 + ((i + WEEK_START) % 7)).toLocaleDateString(undefined, {weekday: 'short'}) : '');
  return `<div class="scroll"><div class="heat">
    <div class="wd">${wd.map(w => `<span>${w}</span>`).join('')}</div>
    <div><div class="months" style="grid-template-columns:repeat(${cols},var(--cell))">${labs}</div>
    <div class="grid">${cells}</div></div></div></div>
    <div class="legend">Less ${[0,1,2,3,4].map(l => `<i class="l${l}" style="${l ? '' : 'background:var(--empty)'}"></i>`).join('')} More</div>`;
}

function monthBars(map, y) {
  const tot = Array.from({length: 12}, (_, m) => { let t = 0;
    for (let d = 1; d <= dim(y, m); d++) t += map[key(y, m, d)] || 0; return t; });
  const mx = Math.max(...tot, 1);
  return `<div class="mbars">${tot.map((t, m) => `<div class="mb" data-month="${m}" title="${mName(m, true)}: ${t}">
    <div class="${t ? '' : 'z'}" style="height:${t ? Math.max(4, t / mx * 100) : 3}%"></div></div>`).join('')}</div>
    <div class="mlab">${tot.map((t, m) => `<span>${mName(m)}<br>${t}</span>`).join('')}</div>`;
}

function monthView(map, y, m) {
  let max = 0; for (let d = 1; d <= dim(y, m); d++) max = Math.max(max, map[key(y, m, d)] || 0);
  const off = (new Date(y, m, 1).getDay() - WEEK_START + 7) % 7;
  const head = Array.from({length: 7}, (_, i) => `<div class="dow">${new Date(2023, 0, 1 + ((i + WEEK_START) % 7)).toLocaleDateString(undefined, {weekday: 'short'})}</div>`).join('');
  let cells = '<div class="day out"></div>'.repeat(off);
  for (let d = 1; d <= dim(y, m); d++) {
    const k = key(y, m, d), c = map[k] || 0;
    cells += `<div class="day l${levelOf(c, max)}${k === TODAY ? ' today' : ''}${k === S.sel ? ' sel' : ''}" data-d="${k}" title="${c} on ${fmtDate(k)}">
      <small>${d}</small><div class="pips">${pips(c, 12)}</div></div>`;
  }
  return `<div class="mcal">${head}${cells}</div>`;
}

function detail(map) {
  const c = map[S.sel] || 0, t = editTracker();
  let ctl;
  if (!ghOk(ghCfg())) ctl = `<button data-act="settings">Set up saving</button>`;
  else if (!t) ctl = `<span class="muted">Pick a tracker to edit</span>`;
  else ctl = `<button data-act="dec" ${c ? '' : 'disabled'} aria-label="Remove one">−1</button><button data-act="inc" class="on" aria-label="Add one">+1</button>`;
  return `<div><b>${fmtDate(S.sel)}</b><div class="muted">${c ? c + (c === 1 ? ' time' : ' times') : 'Nothing logged'}</div></div>
    <div class="pips">${pips(c)}</div><div class="ctl">${ctl}</div>`;
}

function emptyState() {
  return `<div class="panel empty"><h2 style="margin:0">No data loaded</h2>
    <p>Looking for <code>data.json</code> or <code>data.txt</code> next to this page. Browsers usually block that when a page is opened straight from disk (<code>file://</code>).</p>
    <p>Either pick the file by hand, drop it anywhere on this page, or serve this folder with a local server, e.g. <code>python3 -m http.server</code>.</p>
    <p><button onclick="$('#file').click()">Open data file</button></p></div>`;
}

/* ---- Events ---- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-view],[data-d],[data-month],[data-act]'); if (!t) return;
  if (t.dataset.act) {
    const a = t.dataset.act;
    if (a === 'inc') change(1); else if (a === 'dec') change(-1); else openSettings();
    return;
  }
  if (t.dataset.view) { S.view = t.dataset.view; }
  else if (t.dataset.nav) {
    const n = t.dataset.nav;
    if (n === 'today') { S.year = now.getFullYear(); S.month = now.getMonth(); S.sel = TODAY; }
    else if (S.view === 'year') S.year += +n;
    else { S.month += +n; if (S.month < 0) { S.month = 11; S.year--; } if (S.month > 11) { S.month = 0; S.year++; } }
  }
  else if (t.dataset.month !== undefined) { S.month = +t.dataset.month; S.view = 'month'; }
  else if (t.dataset.d) {
    S.sel = t.dataset.d;
    document.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
    t.classList.add('sel'); $('#detail').innerHTML = detail(getMap()); return;
  }
  render();
});
$('#tracker').onchange = e => { S.tracker = e.target.value; render(); };
$('#reload').onclick = () => S.pending.length ? flush() : load();
$('#status').onclick = () => { if (S.pending.length) flush(); };
addEventListener('beforeunload', e => { if (S.pending.length || S.saving) { e.preventDefault(); e.returnValue = ''; } });
$('#open').onclick = () => $('#file').click();
$('#file').onchange = async e => { const f = e.target.files[0]; if (f) setData(await f.text()); e.target.value = ''; };
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drop'); });
addEventListener('dragleave', () => document.body.classList.remove('drop'));
addEventListener('drop', async e => { e.preventDefault(); document.body.classList.remove('drop');
  const f = e.dataTransfer.files[0]; if (f) setData(await f.text()); });

/* ---- Theme and accent (remembered in this browser) ---- */
function store(k, v) { try { v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch {} }
function read(k) { try { return localStorage.getItem(k); } catch { return null; } }
function setTheme(t) { document.documentElement.dataset.theme = t; $('#theme').textContent = t === 'dark' ? 'Light' : 'Dark'; store('kt-theme', t); }
setTheme(read('kt-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
function setAccent(c) { document.documentElement.style.setProperty('--accent', c); $('#accent').value = c; store('kt-accent', c); }
setAccent(read('kt-accent') || DEFAULT_ACCENT);
$('#accent').oninput = e => setAccent(e.target.value);

/* ---- Load ---- */
/* ---- GitHub settings dialog ---- */
const dlg = $('#dlg');
function guess() {                       // pre-fill repo when served from <user>.github.io/<repo>/
  const h = location.hostname; if (!h.endsWith('.github.io')) return {};
  const o = h.split('.')[0], seg = location.pathname.split('/')[1];
  return { repo: `${o}/${seg && !/\.html?$/.test(seg) ? seg : o + '.github.io'}` };
}
function openSettings() {
  const c = ghCfg() || {}, g = guess();
  $('#c-repo').value = c.repo || g.repo || '';
  $('#c-branch').value = c.branch || 'main';
  $('#c-path').value = c.path || S.source || 'data.txt';
  $('#c-token').value = c.token || '';
  dlg.showModal();
}
$('#settings').onclick = openSettings;
$('#c-cancel').onclick = () => dlg.close();
$('#c-forget').onclick = () => { store(GH_KEY, ''); dlg.close(); setStatus('Token removed'); render(); };
$('#cfg').onsubmit = e => {
  e.preventDefault();
  const c = { repo: $('#c-repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, ''),
    branch: $('#c-branch').value.trim() || 'main', path: $('#c-path').value.trim().replace(/^\//, ''),
    token: $('#c-token').value.trim() };
  if (!ghOk(c)) return;
  store(GH_KEY, JSON.stringify(c)); dlg.close(); load();
};

/* ---- Load ---- */
async function load() {
  const c = ghCfg();
  if (ghOk(c)) {                         // read through the API: always the latest commit, no Pages delay
    try {
      const f = await gh(c, 'GET');
      if (f) { setData(b64d(f.content), c.path); return; }
      setData('', c.path); setStatus('File will be created on first save'); return;
    } catch (e) { setStatus('GitHub: ' + e.message, true); }
  }
  for (const f of FILES) {
    try {
      const r = await fetch(f + '?t=' + Date.now(), {cache: 'no-store'});
      if (r.ok) { setData(await r.text(), f); return; }
    } catch {}
  }
  if (!S.loaded) render();
}
load();
</script>
</body>
